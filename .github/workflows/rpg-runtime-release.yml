name: RPG Runtime Release

on:
  push:
    tags: ["retrom-core-g1b4309f4d56d-r*"]

permissions:
  contents: write

concurrency:
  group: rpg-runtime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install archive tool
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Validate release identity
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^retrom-core-g1b4309f4d56d-r[1-9][0-9]*(-rc\.[1-9][0-9]*)?$ ]]
          git fetch origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            'refs/heads/retrom/g1b4309f4d56d:refs/remotes/origin/retrom/g1b4309f4d56d'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/retrom/g1b4309f4d56d
          git merge-base --is-ancestor 1b4309f4d56ded7bfc5ad7ba8d5a9a44ac3388a8 "$GITHUB_SHA"
          test -z "$(git rev-list --min-parents=2 1b4309f4d56ded7bfc5ad7ba8d5a9a44ac3388a8.."$GITHUB_SHA")"
          python3 .github/rpg-runtime/verify-source.py
      - name: Build native VIC-20 core
        run: make EMUTYPE=xvic -j"$(nproc)"
      - name: Build Web assets
        run: |
          mkdir "$RUNNER_TEMP/rpg-runtime-output"
          .github/rpg-runtime/build-web.sh "$RUNNER_TEMP/rpg-runtime-output"
      - name: Validate and describe assets
        run: |
          python3 .github/rpg-runtime/verify-release.py \
            --output "$RUNNER_TEMP/rpg-runtime-output" \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"
      - name: Create immutable-tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --target "$GITHUB_SHA" \
            --title "VICE VIC-20 Web $GITHUB_REF_NAME" --generate-notes \
            "${release_flags[@]}" \
            "$RUNNER_TEMP/rpg-runtime-output/vice_xvic-wasm.data" \
            "$RUNNER_TEMP/rpg-runtime-output/COPYING" \
            "$RUNNER_TEMP/rpg-runtime-output/rpg-runtime-release.json"
