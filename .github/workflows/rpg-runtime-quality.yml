name: RPG Runtime Quality

on:
  pull_request:
    branches: ["retrom/g1b4309f4d56d"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpg-runtime-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install archive tool
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Validate fork source contract
        run: python3 .github/rpg-runtime/verify-source.py
      - name: Build and test native VICE cores
        run: |
          for core in xvic xpet xplus4; do
            make EMUTYPE="$core" -j"$(nproc)"
            python3 .github/rpg-runtime/test-state-restore.py "./vice_${core}_libretro.so"
          done
      - name: Build and validate Web release assets
        run: |
          mkdir "$RUNNER_TEMP/rpg-runtime-output"
          .github/rpg-runtime/build-release.sh "$RUNNER_TEMP/rpg-runtime-output" retrom-core-g1b4309f4d56d-r2-rc.1
      - name: Upload branch integration candidate
        uses: actions/upload-artifact@v4
        with:
          name: rpg-runtime-vice-xvic-${{ github.sha }}
          path: ${{ runner.temp }}/rpg-runtime-output/*
          if-no-files-found: error
          retention-days: 7
